# Yerel / CI: EF migrator ve seed runner (Coolify prod deploy'da build edilmez).
# Kullanım (docker klasöründen):
#   docker compose -f docker-compose.yml -f docker-compose.tools.yml --profile migrate run --rm ada-is-akademi-migrate
#   docker compose -f docker-compose.yml -f docker-compose.tools.yml --profile seed run --rm ada-is-akademi-seedrunner

services:
  ada-is-akademi-seedrunner:
    profiles: ["seed"]
    build:
      context: ..
      dockerfile: tools/AdaIsAkademi.SeedRunner/Dockerfile
    container_name: ada-is-akademi-seedrunner
    restart: "no"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__AdaIs: Host=ada-is-akademi-db;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASS}
      ObjectStorage__ServiceUrl: http://ada-is-akademi-minio:9000
      ObjectStorage__AccessKey: ${MINIO_ROOT_USER}
      ObjectStorage__SecretKey: ${MINIO_ROOT_PASSWORD}
      ObjectStorage__BucketName: ${MINIO_BUCKET:-ada-is-akademi}
      ObjectStorage__ForcePathStyle: "true"
      ObjectStorage__RegionName: us-east-1
    command:
      - --reset
      - --workers
      - "300"
      - --employers
      - "45"
      - --open-postings
      - "120"
      - --closed-postings
      - "80"
      - --seed
      - "12345"
      - --allow-production
    depends_on:
      ada-is-akademi-db:
        condition: service_healthy
      ada-is-akademi-minio:
        condition: service_healthy
      ada-is-akademi-migrate:
        condition: service_completed_successfully
    networks:
      - coolify
      - default

  ada-is-akademi-migrate:
    profiles: ["migrate", "seed"]
    build:
      context: ..
      dockerfile: tools/AdaIsAkademi.Migrator/Dockerfile
    container_name: ada-is-akademi-migrate
    restart: "no"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      DbConfig__Provider: 30
      DbConfig__Host: ada-is-akademi-db
      DbConfig__Port: 5432
      DbConfig__Database: ${DB_NAME}
      DbConfig__Username: ${DB_USER}
      DbConfig__Password: ${DB_PASS}
    depends_on:
      ada-is-akademi-db:
        condition: service_healthy
    networks:
      - coolify
      - default

networks:
  coolify:
    external: true
