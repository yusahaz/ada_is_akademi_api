name: AdaIsAkademi

services:
  ada-is-akademi-db:
    image: postgres:17-alpine
    container_name: ada-is-akademi-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - ${DB_PORT}:5432
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]

  ada-is-akademi-redis:
    image: redis:7-alpine
    container_name: ada-is-akademi-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - ${REDIS_PORT}:6379
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping"]

  ada-is-akademi-minio:
    image: minio/minio:latest
    container_name: ada-is-akademi-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - ${MINIO_PORT}:9000
      - ${MINIO_PORT_SECURE}:9001
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9000/minio/health/live"]

  ada-is-akademi-minio-init:
    image: minio/mc:latest
    container_name: ada-is-akademi-minio-init
    restart: "no"
    depends_on:
      ada-is-akademi-minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-ada-is-akademi}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'mc alias set ada http://ada-is-akademi-minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; mc mb --ignore-existing ada/"$$MINIO_BUCKET"'

  ada-is-akademi-dbview:
    image: dpage/pgadmin4:latest
    container_name: ada-is-akademi-dbview
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${DBVIEW_USER}
      PGADMIN_DEFAULT_PASSWORD: ${DBVIEW_PASSWORD}
    ports:
      - ${DBVIEW_PORT}:80
    volumes:
      - dbview_data:/var/lib/pgadmin

  ada-is-akademi-api:
    build:
      context: ../..
      dockerfile: AdaIsAkademi/src/Api/Dockerfile
    image: ada-is-akademi-api:latest
    container_name: ada-is-akademi-api
    restart: unless-stopped
    ports:
      - ${API_PORT}:8080
    volumes:
      - api_dataprotection_keys:/home/app/.aspnet/DataProtection-Keys
    environment:
      ASPNETCORE_URLS: ${ASPNETCORE_URLS}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      JwtConfig__Issuer: ${JWT_ISSUER}
      JwtConfig__Audience: ${JWT_AUDIENCE}
      JwtConfig__Key: ${JWT_SIGNING_KEY}
      JwtConfig__ExpireMinutes: ${JWT_EXPIRE_MINUTES}
      JwtConfig__RefreshTokenExpireDays: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS}
      DbConfig__Provider: 30
      DbConfig__Host: ada-is-akademi-db
      DbConfig__Port: 5432
      DbConfig__Database: ${DB_NAME}
      DbConfig__Username: ${DB_USER}
      DbConfig__Password: ${DB_PASS}
      RedisConfig__Enabled: ${REDIS_CONFIG_ENABLED:-true}
      RedisConfig__ConnectionString: ${REDIS_CONFIG_CONNECTION:-ada-is-akademi-redis:6379,password=${REDIS_PASSWORD}}
      RedisConfig__InstanceName: ${REDIS_CONFIG_INSTANCE_NAME:-ada-is-akademi}
      ObjectStorageConfig__ServiceUrl: ${OBJECT_STORAGE_SERVICE_URL:-http://ada-is-akademi-minio:9000}
      ObjectStorageConfig__AccessKey: ${OBJECT_STORAGE_ACCESS_KEY:-${MINIO_ROOT_USER}}
      ObjectStorageConfig__SecretKey: ${OBJECT_STORAGE_SECRET_KEY:-${MINIO_ROOT_PASSWORD}}
      ObjectStorageConfig__BucketName: ${OBJECT_STORAGE_BUCKET_NAME:-${MINIO_BUCKET:-ada-is-akademi}}
      ObjectStorageConfig__ForcePathStyle: ${OBJECT_STORAGE_FORCE_PATH_STYLE:-true}
      ObjectStorageConfig__RegionName: ${OBJECT_STORAGE_REGION_NAME:-us-east-1}
    depends_on:
      ada-is-akademi-db:
        condition: service_healthy
      ada-is-akademi-redis:
        condition: service_healthy
      ada-is-akademi-minio:
        condition: service_healthy
      ada-is-akademi-minio-init:
        condition: service_completed_successfully

  ada-is-akademi-backup:
    profiles: ["backup"]
    build:
      context: ./backup
      dockerfile: Dockerfile
    container_name: ada-is-akademi-backup
    restart: unless-stopped
    environment:
      DB_HOST: ada-is-akademi-db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      BACKUP_CRON_SCHEDULE: ${BACKUP_CRON_SCHEDULE}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS}
      RUN_RESTORE_SMOKE: ${BACKUP_RESTORE_SMOKE}
      TZ: ${BACKUP_TZ}
    volumes:
      - db_data:/source/db:ro
      - minio_data:/source/minio:ro
      - backup_data:/backups
    depends_on:
      ada-is-akademi-db:
        condition: service_healthy
      ada-is-akademi-minio:
        condition: service_healthy

volumes:
  db_data:
  redis_data:
  minio_data:
  dbview_data:
  api_dataprotection_keys:
  backup_data:
